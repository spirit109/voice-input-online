name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Ubuntu/GNOME version, Wayland or X11, Python version
      placeholder: "Ubuntu 24.04, GNOME Wayland, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove Azure keys and personal data before posting.
      render: shell
